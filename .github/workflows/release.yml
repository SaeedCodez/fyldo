name: Release

# Run by hand on main: `gh workflow run release.yml -f version=X.Y.Z` (or `X.Y.Z-beta.1`). The workflow runs the full CI,
# builds the ZIP, pushes the tag on the Composer release commit and creates the GitHub Release. See docs/ARCHITECTURE.md §5.
on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to release, without the v (it must match fyldo.php)
        required: true
        type: string

permissions:
  contents: read

jobs:
  ci:
    name: CI
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/ci.yml

  release:
    name: Build, Composer tag, GitHub Release
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: write # push the tag on the release commit, create the Release
    env:
      TAG: v${{ inputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm }
      - uses: shivammathur/setup-php@v2
        with: { php-version: '8.2', coverage: none }
      - uses: ./.github/actions/install-wp-cli
      - run: sudo apt-get install -y gettext zip
      - run: npm ci

      # Tag ↔ fyldo.php ↔ package.json ↔ CHANGELOG.md, then tokens, build, i18n, size budgets, `php -l`, the tree
      # check (runtime files only) and build/fyldo.zip.
      - name: Build the release artifacts
        run: npm run release -- --tag "$TAG"

      # Packagist serves `git archive` of a tag, which cannot hold untracked files. So the tag goes on a release commit
      # on top of the source commit that force-adds the built assets; `main` never gets them. The tag is pushed once and
      # never moves: Packagist keeps the first commit it reads for a tag. A re-run finds the tag pushed and skips this.
      - name: Composer release commit and tag
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" > /dev/null; then
            echo "$TAG is already pushed."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -f assets/dist languages
            git commit -m "Release ${TAG} (prebuilt assets)"
            git tag "$TAG"
            # The tag's tree must be exactly what the ZIP contains.
            mkdir "$RUNNER_TEMP/archive"
            git archive "$TAG" | tar -x -C "$RUNNER_TEMP/archive"
            diff -r build/fyldo "$RUNNER_TEMP/archive"
            git push origin "refs/tags/$TAG"
          fi

      - name: GitHub Release
        run: |
          VERSION="${TAG#v}"
          awk -v v="$VERSION" '/^## \[/ { p = (index($0, "## [" v "]") == 1); next } p && !/^\[[^]]*\]:/' CHANGELOG.md > "$RUNNER_TEMP/notes.md"
          test -s "$RUNNER_TEMP/notes.md"
          PRERELEASE=""
          case "$VERSION" in *-*) PRERELEASE="--prerelease" ;; esac
          gh release create "$TAG" build/fyldo.zip --verify-tag --title "Fyldo $VERSION" --notes-file "$RUNNER_TEMP/notes.md" $PRERELEASE
