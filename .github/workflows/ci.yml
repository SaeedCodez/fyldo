name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call: # the release workflow runs the full CI first

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  php:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['7.4', '8.0', '8.1', '8.2', '8.3', '8.4']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer
      # PHPUnit 9.6 / PHPCS 3.x support the whole 7.4–8.4 range.
      - run: composer install --no-interaction --no-progress
      - run: composer test
      - name: Coding standards + PHP 7.4 syntax ceiling + static analysis (level 8)
        if: matrix.php == '8.2'
        run: |
          composer lint
          composer analyse

  # The frozen Loader (docs/ARCHITECTURE.md §6.2) of every released v1.* tag negotiates with this tree, both orders, plus a
  # tie. PHP 7.4 only: the syntax floor. A new tag is picked up automatically; the job fails when no tag was tested.
  contract:
    name: Loader contract (old tags)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 } # the tags
      - uses: shivammathur/setup-php@v2
        with: { php-version: '7.4', coverage: none }
      - run: php tests/contract/run.php

  js:
    name: Tokens · types · lint · unit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm }
      - uses: shivammathur/setup-php@v2
        with: { php-version: '8.2', coverage: none }
      - uses: ./.github/actions/install-wp-cli
      - run: npm ci
      - name: "Design tokens are in sync with the Figma snapshot (strict: missing Figma tokens fail here)"
        run: npm run tokens:check
      - run: npm run typecheck
      - run: npm run lint
      - name: Unit tests (includes the WCAG contrast test — no expected failures)
        run: npm test
      - name: Translations are complete
        run: |
          sudo apt-get install -y gettext
          npm run i18n

  # A pull request carries its own installable build: download the `fyldo-plugin-zip` artifact from the run.
  # (Releases build the same ZIP in release.yml, so this job is skipped there.)
  package:
    name: Plugin ZIP (PR build)
    if: github.event_name == 'pull_request'
    needs: [php, js]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm }
      - uses: shivammathur/setup-php@v2
        with: { php-version: '8.2', coverage: none }
      - uses: ./.github/actions/install-wp-cli
      - run: sudo apt-get install -y gettext zip
      - run: npm ci
      - name: Build build/fyldo.zip (the same command as a release)
        run: npm run release
      - uses: actions/upload-artifact@v4
        with:
          name: fyldo-plugin-zip
          path: build/fyldo.zip
          if-no-files-found: error

  e2e:
    name: Playwright on wp-env
    runs-on: ubuntu-latest
    needs: [php, js]
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 } # the upgrade fixture bundles the newest v1.* tag below fyldo.php (N-1)
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm }
      - uses: shivammathur/setup-php@v2
        with: { php-version: '8.2', coverage: none }
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Build the release tree
        run: npm run build && npm run build:gallery
      - name: Generate coexistence fixtures (1.0.0, 1.1.0 ×2, synthetic 2.0.0, Strauss-prefixed) and the upgrade fixture (N-1 + current)
        run: npx tsx tools/fixtures/make-demos.ts
      - run: npx wp-env start
      - name: Figma parity, visual, isolation and upgrade suites
        run: npx playwright test
      - name: Bundle size budgets
        run: npm run size
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
